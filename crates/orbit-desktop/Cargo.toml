[package]
name = "orbit-desktop"
description = "OrbitOS desktop environment with Claude built in"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "orbit-desktop"
path = "src/main.rs"

[dependencies]
orbit-core = { path = "../orbit-core", default-features = false }
eframe.workspace = true
chrono.workspace = true
dirs.workspace = true

[features]
default = ["audio"]
# In-app music playback (needs ALSA headers on Linux to build).
audio = ["orbit-core/audio"]
