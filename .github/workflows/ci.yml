name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # objc2 0.4 (via winit 0.29) does not compile on the newest Rust on macOS; pin until eframe is upgraded
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ runner.os == 'macOS' && '1.90' || 'stable' }}
      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libasound2-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - run: cargo test --workspace
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: orbitos-${{ matrix.os }}
          path: |
            target/release/orbit
            target/release/orbit-desktop
            target/release/orbit.exe
            target/release/orbit-desktop.exe
