name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libasound2-dev
      - run: cargo test --workspace
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: orbitos-${{ matrix.os }}
          path: |
            target/release/orbit
            target/release/orbit-desktop
            target/release/orbit.exe
            target/release/orbit-desktop.exe
