name: Release installers

# Push a tag like v0.3.0 to build installers for every OS and attach them
# to a GitHub release. Run it by hand from the Actions tab too.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: nsis,wix
          - os: macos-latest
            formats: app,dmg
          - os: macos-15-intel
            formats: app,dmg
          - os: ubuntu-22.04
            formats: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # objc2 0.4 (via winit 0.29) does not compile on the newest Rust on macOS; pin until eframe is upgraded
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ runner.os == 'macOS' && '1.90' || 'stable' }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libasound2-dev libfuse2 libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Test
        run: cargo test --workspace
      - name: Build installers
        run: cargo packager --release -p orbit-desktop --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v4
        with:
          name: orbitos-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.msi
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
